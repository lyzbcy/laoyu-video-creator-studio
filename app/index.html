<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>捞鱼打标工具</title>
<style>
  :root {
    --bg: #f5efe3;
    --paper: #fffdf6;
    --paper-2: #faf5e9;
    --border: #e6dbc4;
    --border-strong: #d5c6a5;
    --ink: #57452f;
    --ink-soft: #8a7659;
    --ink-faint: #b3a184;
    --tang: #e8613c;
    --tang-deep: #cf4a28;
    --tang-soft: #fbe3da;
    --moss: #7fa863;
    --moss-soft: #e7f0dd;
    --berry: #9a7bb8;
    --berry-soft: #efe6f6;
    --sky: #6d94b8;
    --sky-soft: #e2ecf4;
    --shadow: 0 2px 0 var(--border-strong), 0 8px 20px rgba(140,110,60,.12);
    --shadow-pop: 0 4px 0 var(--border-strong), 0 12px 28px rgba(140,110,60,.18);
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "微软雅黑", "楷体", sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(232,97,60,.05) 0 180px, transparent 181px),
      radial-gradient(circle at 88% 92%, rgba(127,168,99,.06) 0 220px, transparent 221px);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-size: 14px;
  }
  button { font-family: inherit; }

  /* Q 弹通用 */
  .bouncy {
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease, background .15s ease;
  }
  .bouncy:active { transform: scale(.93); }
  @keyframes popIn {
    0% { transform: scale(.6); opacity: 0; }
    65% { transform: scale(1.12); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes tagPop {
    0% { transform: scale(.7); }
    55% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  @keyframes wobble {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }
  @keyframes riseFade {
    from { transform: translateY(6px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* ── 顶栏 ─────────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--paper);
    border-bottom: 2px solid var(--border);
    flex-shrink: 0;
    flex-wrap: wrap;
    box-shadow: 0 2px 10px rgba(140,110,60,.08);
  }
  #logoBtn {
    width: 44px; height: 44px;
    border: 2px solid var(--border-strong);
    border-radius: 14px;
    background: var(--paper-2);
    cursor: pointer;
    padding: 3px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  #logoBtn img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }
  #logoBtn:hover::after {
    content: "换个头像";
    position: absolute;
    bottom: -22px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: var(--ink-soft);
    background: var(--paper); border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 8px; white-space: nowrap;
    z-index: 5;
  }
  header .brand { display: flex; flex-direction: column; margin-right: 8px; }
  header h1 { font-size: 17px; letter-spacing: 1px; }
  header .brand small { font-size: 10px; color: var(--ink-faint); letter-spacing: 2px; }
  .pill {
    background: var(--moss-soft);
    border: 2px solid var(--moss);
    border-radius: 999px;
    padding: 3px 13px;
    font-size: 13px;
    color: #4c6b3a;
    white-space: nowrap;
  }
  .pill b { font-size: 14px; }
  header .spacer { flex: 1; }
  .btn {
    background: var(--paper-2);
    color: var(--ink);
    border: 2px solid var(--border-strong);
    border-radius: 13px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 2px 0 var(--border-strong);
  }
  .btn:hover { background: #fff; }
  .btn.primary {
    background: var(--tang);
    border-color: var(--tang-deep);
    color: #fff;
    box-shadow: 0 2px 0 var(--tang-deep);
  }
  .btn.primary:hover { background: #ef7250; }
  .btn.moss {
    background: var(--moss);
    border-color: #688c4f;
    color: #fff;
    box-shadow: 0 2px 0 #688c4f;
  }
  .btn.moss:hover { background: #8bbb6e; }
  .btn.small { padding: 3px 9px; font-size: 12px; border-radius: 10px; }
  .btn.danger { color: #b04327; }
  .btn.danger:hover { border-color: var(--tang); background: var(--tang-soft); }
  #dbStatus {
    font-size: 12px;
    color: var(--ink-soft);
    max-width: 320px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 4px 10px;
    border-radius: 10px;
    background: var(--paper-2);
    border: 1px dashed var(--border-strong);
  }
  #dbStatus.ok { color: #4c6b3a; background: var(--moss-soft); border-color: var(--moss); }
  #dbStatus.wait { color: #9c6a1f; background: #faf0d8; border-color: #d8b968; cursor: pointer; }
  #dbStatus.warn { color: #b04327; background: var(--tang-soft); border-color: var(--tang); }

  /* 恢复连接横幅 */
  #restoreBanner {
    display: none;
    padding: 8px 16px;
    background: #faf0d8;
    border-bottom: 2px solid #d8b968;
    font-size: 13px;
    color: #7a5511;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  #restoreBanner.show { display: flex; }

  /* ── 主区 ─────────────────────────── */
  main { flex: 1; display: flex; min-height: 0; }

  #left {
    width: 330px;
    min-width: 250px;
    background: var(--paper);
    border-right: 2px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  #filterBar {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    border-bottom: 2px dashed var(--border);
  }
  #searchBox {
    background: var(--paper-2);
    border: 2px solid var(--border-strong);
    border-radius: 12px;
    color: var(--ink);
    padding: 7px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  #searchBox:focus { outline: none; border-color: var(--tang); background: #fff; }
  .filterRow { display: flex; gap: 6px; }
  .filterRow button {
    flex: 1;
    padding: 4px 0;
    font-size: 12px;
    border-radius: 11px;
    border: 2px solid var(--border-strong);
    background: var(--paper-2);
    color: var(--ink-soft);
    cursor: pointer;
    box-shadow: 0 2px 0 var(--border-strong);
  }
  .filterRow button.active {
    background: var(--tang);
    border-color: var(--tang-deep);
    color: #fff;
    box-shadow: 0 2px 0 var(--tang-deep);
  }
  .filterRow button .cnt { font-size: 10px; opacity: .8; margin-left: 2px; }
  #tagFilterRow { display: flex; gap: 5px; flex-wrap: wrap; }
  .tf-tag {
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 999px;
    border: 1.5px solid var(--border-strong);
    background: var(--paper-2);
    color: var(--ink-soft);
    cursor: pointer;
    animation: popIn .25s cubic-bezier(.34,1.56,.64,1);
  }
  .tf-tag.on { background: var(--tang); color: #fff; border-color: var(--tang-deep); }

  #trackList { flex: 1; overflow-y: auto; padding: 6px; }
  .track {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 10px;
    cursor: pointer;
    border-radius: 13px;
    border: 2px solid transparent;
    margin-bottom: 3px;
    transition: background .12s, border-color .12s, transform .12s;
  }
  .track:hover { background: var(--paper-2); transform: translateX(3px); }
  .track.current {
    background: var(--tang-soft);
    border-color: var(--tang);
  }
  .track .status { width: 18px; text-align: center; flex-shrink: 0; font-size: 13px; }
  .track .kindBadge {
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 8px;
    flex-shrink: 0;
    border: 1.5px solid;
  }
  .kindBadge.music { color: #4c6b3a; background: var(--moss-soft); border-color: var(--moss); }
  .kindBadge.sfx { color: #4a5f86; background: var(--sky-soft); border-color: var(--sky); }
  .track .name {
    flex: 1;
    font-size: 11.5px;
    font-family: Consolas, monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--ink-soft);
  }
  .track.current .name { color: var(--ink); font-weight: 600; }
  .track .preview-tags {
    font-size: 10px;
    color: var(--tang);
    flex-shrink: 0;
    max-width: 92px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .track .dur { font-size: 10.5px; color: var(--ink-faint); flex-shrink: 0; font-family: Consolas, monospace; }
  #emptyHint {
    padding: 34px 18px;
    color: var(--ink-soft);
    text-align: center;
    line-height: 2;
    font-size: 13px;
  }
  #emptyHint img { width: 72px; height: 72px; display: block; margin: 0 auto 10px; animation: wobble 2.6s ease-in-out infinite; }

  /* 右侧 */
  #right { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow-y: auto; }

  /* 播放器 */
  #player {
    padding: 16px 20px 12px;
    background: var(--paper);
    border-bottom: 2px dashed var(--border);
    position: relative;
  }
  #player .stickerCorner {
    position: absolute;
    right: 18px; top: 12px;
    width: 46px; height: 46px;
    animation: wobble 3.2s ease-in-out infinite;
    pointer-events: none;
    opacity: .85;
  }
  #nowName {
    font-family: Consolas, monospace;
    font-size: 14px;
    margin-bottom: 10px;
    word-break: break-all;
    animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
  }
  #nowName .fmt { color: #b08a2e; font-size: 11px; margin-left: 8px; font-family: "微软雅黑"; }
  #waveWrap {
    position: relative;
    height: 64px;
    background: var(--paper-2);
    border: 2px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  #waveCanvas { width: 100%; height: 100%; display: block; cursor: pointer; }
  #waveProgress {
    position: absolute; top: 0; left: 0; height: 100%; width: 0;
    background: linear-gradient(90deg, rgba(232,97,60,.12), rgba(232,97,60,.3));
    pointer-events: none;
  }
  #ctrlRow { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  #btnPlay {
    width: 52px; height: 40px;
    font-size: 15px;
  }
  #timeLabel { font-size: 12px; color: var(--ink-soft); font-family: Consolas, monospace; }
  #seekBar { flex: 1; min-width: 120px; accent-color: var(--tang); }
  .rateSel {
    background: var(--paper-2); color: var(--ink);
    border: 2px solid var(--border-strong); border-radius: 10px;
    font-size: 12px; padding: 2px 5px; font-family: inherit;
  }
  #loopChk { font-size: 12px; color: var(--ink-soft); display: flex; align-items: center; gap: 4px; cursor: pointer; accent-color: var(--tang); }
  #vol { width: 78px; accent-color: var(--tang); }

  /* 打标区 */
  #tagZone { padding: 14px 20px 34px; }
  .groupCard {
    background: var(--paper);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 14px;
    margin-bottom: 13px;
    box-shadow: var(--shadow);
  }
  .groupHead { display: flex; align-items: center; gap: 8px; margin-bottom: 11px; }
  .groupHead .gname { font-size: 14.5px; font-weight: 700; letter-spacing: 1px; }
  .groupHead .gdot { width: 9px; height: 9px; border-radius: 50%; background: var(--tang); display: inline-block; }
  .groupCard:nth-child(3n+2) .gdot { background: var(--moss); }
  .groupCard:nth-child(3n) .gdot { background: var(--berry); }
  .groupHead .gcount { font-size: 11px; color: var(--ink-faint); }
  .groupHead .spacer { flex: 1; }
  .tagRow { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    padding: 5px 14px;
    border-radius: 999px;
    background: var(--paper-2);
    border: 2px solid var(--border-strong);
    cursor: pointer;
    user-select: none;
    font-size: 13px;
    color: var(--ink-soft);
    box-shadow: 0 2px 0 var(--border-strong);
    transition: all .15s;
  }
  .tag:hover { border-color: var(--tang); color: var(--ink); transform: translateY(-1px); }
  .tag.on {
    background: var(--tang);
    border-color: var(--tang-deep);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 2px 0 var(--tang-deep);
    animation: tagPop .25s cubic-bezier(.34,1.56,.64,1);
  }
  .tag .delTag { margin-left: 6px; color: rgba(255,255,255,.55); font-size: 11px; }
  .tag .delTag:hover { color: #fff; }

  /* 备注与操作 */
  #noteZone {
    background: var(--paper);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 14px;
    margin-bottom: 13px;
    box-shadow: var(--shadow);
  }
  #noteZone label { font-size: 12.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
  #noteZone label img { width: 20px; height: 20px; }
  #noteBox {
    width: 100%;
    background: var(--paper-2);
    border: 2px solid var(--border-strong);
    border-radius: 12px;
    color: var(--ink);
    padding: 9px 11px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
    min-height: 40px;
  }
  #noteBox:focus { outline: none; border-color: var(--tang); background: #fff; }
  #navRow { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
  #navRow .hint { font-size: 11.5px; color: var(--ink-faint); margin-left: auto; }

  /* 弹层 */
  dialog {
    background: var(--paper);
    color: var(--ink);
    border: 2px solid var(--border-strong);
    border-radius: 20px;
    padding: 20px;
    min-width: 360px;
    max-width: 82vw;
    box-shadow: var(--shadow-pop);
  }
  dialog::backdrop { background: rgba(90,70,45,.35); }
  dialog h3 { margin-bottom: 12px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  dialog h3 img { width: 26px; height: 26px; }
  dialog input[type=text] {
    width: 100%;
    background: var(--paper-2);
    border: 2px solid var(--border-strong);
    border-radius: 12px;
    color: var(--ink);
    padding: 8px 11px;
    font-size: 13px;
    font-family: inherit;
    margin-bottom: 14px;
  }
  dialog input:focus { outline: none; border-color: var(--tang); }
  dialog .dlgBtns { display: flex; gap: 8px; justify-content: flex-end; }

  /* 贴纸选择器 */
  #stickerGrid { display: flex; flex-wrap: wrap; gap: 10px; max-width: 420px; max-height: 320px; overflow-y: auto; padding: 4px; }
  .stickerCell {
    width: 64px; height: 64px;
    border: 2px solid var(--border-strong);
    border-radius: 14px;
    background: var(--paper-2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 4px;
    transition: transform .15s cubic-bezier(.34,1.56,.64,1), border-color .15s;
  }
  .stickerCell:hover { transform: scale(1.12); border-color: var(--tang); }
  .stickerCell.on { border-color: var(--tang); background: var(--tang-soft); }
  .stickerCell img { width: 100%; height: 100%; object-fit: contain; }

  /* 日志面板 */
  #logBody {
    font-family: Consolas, monospace;
    font-size: 11.5px;
    background: #3f3626;
    color: #efe6d2;
    border-radius: 12px;
    padding: 10px;
    max-height: 380px;
    min-width: 480px;
    overflow-y: auto;
    line-height: 1.65;
  }
  .log-line { display: flex; gap: 8px; }
  .log-line .lt { color: #b3a184; flex-shrink: 0; }
  .log-line .lv { flex-shrink: 0; width: 34px; text-align: center; border-radius: 5px; }
  .log-line .lv.info { color: #9fc3e8; }
  .log-line .lv.ok { color: #a5d18a; }
  .log-line .lv.warn { color: #ecc76b; }
  .log-line .lv.err { color: #ef9a86; }
  .log-line .la { color: #f3c9a8; flex-shrink: 0; }
  .log-line .ld { word-break: break-all; }

  /* toast */
  #toast {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%) translateY(100px) scale(.8);
    background: var(--ink);
    color: #fff8ec;
    padding: 10px 20px;
    border-radius: 16px;
    font-size: 13.5px;
    display: flex; align-items: center; gap: 9px;
    box-shadow: 0 6px 24px rgba(60,45,25,.35);
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    z-index: 99;
    pointer-events: none;
    max-width: 80vw;
  }
  #toast img { width: 26px; height: 26px; }
  #toast.show { transform: translateX(-50%) translateY(0) scale(1); }
  #toast.err { background: #a14025; }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<header>
  <button id="logoBtn" title="点我换头像"><img id="logoImg" src="assets/stickers/happy.png" alt="捞鱼"></button>
  <div class="brand">
    <h1>捞鱼打标工具</h1>
    <small>LAOYU TAGGER · BGM/音效 打标小铺</small>
  </div>
  <span class="pill">已打 <b id="progDone">0</b> / <span id="progTotal">0</span></span>
  <button class="btn moss bouncy" id="btnSyncJy" title="增量导入剪映缓存文件夹里的音乐（已导入过的自动跳过）">⤵ 一键同步剪映缓存</button>
  <button class="btn bouncy" id="btnAddMusic">🎵 加音乐目录</button>
  <button class="btn bouncy" id="btnAddSfx">🔊 加音效目录</button>
  <button class="btn bouncy" id="btnBind">🔗 数据库</button>
  <span id="dbStatus">未绑定 — 数据只存浏览器本地</span>
  <span class="spacer"></span>
  <button class="btn bouncy" id="btnAiTag" title="根据备注文本自动补标签（增量，不覆盖已有标签）">✨ 备注打标</button>
  <button class="btn primary bouncy" id="btnOrganize" title="把已打标文件按标准名复制到指定文件夹">📦 整理导出</button>
  <button class="btn bouncy" id="btnLog">📒 日志</button>
  <button class="btn bouncy" id="btnImport">导入</button>
  <button class="btn bouncy" id="btnExport">导出</button>
</header>

<div id="restoreBanner">
  <span>🔗 上次绑定的数据库文件等你确认连接</span>
  <button class="btn primary small bouncy" id="btnRestore">点我恢复连接</button>
</div>

<div id="updateBanner" style="display:none; padding:9px 16px; background:var(--tang-soft); border-bottom:2px solid var(--tang); font-size:13px; color:#8a3a1e; align-items:center; gap:10px; flex-shrink:0; flex-wrap:wrap;">
  <span id="updateText">🆕 发现新版本</span>
  <button class="btn primary small bouncy" id="btnUpdateNow">一键更新</button>
  <a class="btn small bouncy" id="btnUpdatePage" href="https://lyzbcy.github.io/laoyu-tagger/" target="_blank" style="text-decoration:none">打开发布页</a>
  <button class="btn small bouncy" id="btnUpdateIgnore">忽略此版本</button>
</div>

<main>
  <div id="left">
    <div id="filterBar">
      <input id="searchBox" type="text" placeholder="搜文件名或备注关键词…">
      <div class="filterRow">
        <button class="active" data-f="all">全部<span class="cnt" id="cntAll"></span></button>
        <button data-f="labeled">✅ 已打<span class="cnt" id="cntDone"></span></button>
        <button data-f="unlabeled">⬜ 未打<span class="cnt" id="cntTodo"></span></button>
      </div>
      <div class="filterRow">
        <button class="active" data-k="all">🎵+🔊</button>
        <button data-k="music">🎵 音乐</button>
        <button data-k="sfx">🔊 音效</button>
      </div>
      <div id="tagFilterRow"></div>
    </div>
    <div id="trackList"></div>
  </div>

  <div id="right">
    <div id="player">
      <img class="stickerCorner" id="cornerSticker" src="assets/stickers/wave.png" alt="">
      <div id="nowName">还没有选中音频，先从左边挑一首吧 <span class="fmt"></span></div>
      <div id="waveWrap">
        <canvas id="waveCanvas"></canvas>
        <div id="waveProgress"></div>
      </div>
      <div id="ctrlRow">
        <button id="btnPlay" class="btn primary bouncy">▶</button>
        <span id="timeLabel">0:00 / 0:00</span>
        <input id="seekBar" type="range" min="0" max="1000" value="0">
        <select id="rateSel" class="rateSel" title="倍速">
          <option value="1">1.0x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2.0x</option>
        </select>

};

const $ = id => document.getElementById(id);

/* ══════════════ 日志系统 ══════════════ */

let LOGS = [];
try { LOGS = JSON.parse(localStorage.getItem(LS_KEY_LOG) || "[]"); } catch (e) { LOGS = []; }
const LOG_MAX = 600;

function log(level, action, detail) {
  LOGS.push({ t: Date.now(), lv: level, a: action, d: String(detail ?? "") });
  if (LOGS.length > LOG_MAX) LOGS = LOGS.slice(-LOG_MAX);
  try { localStorage.setItem(LS_KEY_LOG, JSON.stringify(LOGS)); } catch (e) {}
  if (LOGS.length <= 8) console.log(`[${level}] ${action}: ${detail ?? ""}`);
}

function fmtLogTime(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, "0");
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function renderLogPanel() {
  const body = $("logBody");
  const frag = document.createDocumentFragment();
  for (const l of LOGS.slice(-300).reverse()) {
    const div = document.createElement("div");
    div.className = "log-line";
    div.innerHTML = `<span class="lt">${fmtLogTime(l.t)}</span>` +
      `<span class="lv ${l.lv}">${l.lv}</span>` +
      `<span class="la">${l.a}</span>` +
      `<span class="ld">${l.d.replace(/</g, "&lt;")}</span>`;
    frag.appendChild(div);
  }
  body.replaceChildren(frag);
  $("logCount").textContent = `（共 ${LOGS.length} 条，展示最近 300）`;
}

$("btnLog").addEventListener("click", () => { renderLogPanel(); $("dlgLog").showModal(); });

/* ══════════════ toast（带贴纸） ══════════════ */

function toast(msg, isErr, sticker) {
  $("toastText").textContent = msg;
  $("toastSticker").src = "assets/stickers/" + (isErr ? "wah.png" : (sticker || STICKERS[Math.floor(Math.random()*STICKERS.length)] + ".png"));

  t.className = isErr ? "err show" : "show";
  clearTimeout(t._h);
  t._h = setTimeout(() => t.className = "", 2400);
}

function nowISO() { return new Date().toISOString(); }
function fmtTime(s) {
  if (!isFinite(s)) return "0:00";
  s = Math.floor(s);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

/* ══════════════ IndexedDB：持久化数据库 handle ══════════════ */

function openIDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("laoyu_tagger", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("handles");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbPut(key, val) {
  const db = await openIDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("handles", "readwrite");
    tx.objectStore("handles").put(val, key);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(key) {
  const db = await openIDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("handles", "readonly");
    const rq = tx.objectStore("handles").get(key);
    rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
  });
}

/* ══════════════ 状态持久化（localStorage 兜底） ══════════════ */

function snapshot() {
  const tracks = {};
  for (const id in state.tracks) {
    const t = state.tracks[id];
    tracks[id] = { id: t.id, file: t.file, kind: t.kind, fmt: t.fmt, size: t.size, duration: t.duration };
  }
  return { groups: state.groups, tracks, records: state.records, order: state.order, current: state.current };
}

function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(snapshot())); } catch (e) {
    log("warn", "本地快照", "localStorage 写入失败（可能超容量）：" + e.message);
  }
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY) || localStorage.getItem("bgm_tagger_state_v1"); // 兼容 v1
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || !s.tracks) return false;
    state.groups = s.groups && s.groups.length ? s.groups : state.groups;
    state.tracks = s.tracks;
    for (const id in state.tracks) if (!state.tracks[id].kind) state.tracks[id].kind = "music"; // v1 迁移
    state.records = s.records || {};
    state.order = s.order || Object.keys(s.tracks);
    state.current = s.current || null;
    return true;
  } catch (e) { log("err", "恢复", "本地状态解析失败：" + e.message); return false; }
}

/* ══════════════ JSONL 构建 / 导入 ══════════════ */

function buildJSONLText() {
  const lines = [JSON.stringify({ _meta: "schema", version: 2, app: "捞鱼打标工具", groups: state.groups })];
  for (const id of state.order.slice().sort()) {
    if (state.records[id]) lines.push(JSON.stringify(state.records[id]));
  }
  return lines.join("\n") + "\n";
}

async function saveDB(reason) {
  saveLocal();
  if (!state.handle) return;
  try {
    const w = await state.handle.createWritable();
    await w.write(buildJSONLText());
    await w.close();
    const f = await state.handle.getFile();
    state.lastKnownMtime = f.lastModified; // 自己写的，轮询时跳过
    log("ok", "写库", `${reason || "保存"} · ${Object.keys(state.records).length} 条记录`);
  } catch (e) {
    log("err", "写库", "失败：" + e.message);
    toast("写入数据库失败：" + e.message, true);
  }
}

let saveTimer = null;
function scheduleSave(reason) {
  saveLocal();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveDB(reason), 800);
}

function importJSONLText(text, silent, fromExternal) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  let meta = null, count = 0;
  for (const line of lines) {
    let obj;
    try { obj = JSON.parse(line); } catch (e) { continue; }
    if (obj._meta === "schema") { meta = obj; continue; }
    if (obj.id) {
      if (!obj.kind) obj.kind = "music";
      state.records[obj.id] = obj;
      count++;
      if (state.tracks[obj.id]) {
        if (obj.duration && !state.tracks[obj.id].duration) state.tracks[obj.id].duration = obj.duration;
        if (obj.kind) state.tracks[obj.id].kind = obj.kind;
      } else {
        state.tracks[obj.id] = { id: obj.id, file: obj.file || obj.id, kind: obj.kind, name: obj.id, fmt: "", size: 0 };
      }
    }
  }
  if (meta && Array.isArray(meta.groups) && meta.groups.length) state.groups = meta.groups;
  rebuildOrder();
  log(fromExternal ? "warn" : "info", fromExternal ? "外部同步" : "导入", `读入 ${count} 条记录`);
  if (!silent) toast(`已导入 ${count} 条记录`, false, "thanks.png");
  return count;
}

/* ══════════════ 数据库绑定 / 恢复 / 外部变更轮询 ══════════════ */

function updateDbStatus() {
  const el = $("dbStatus");
  if (state.handle) {
    el.className = "ok";
    el.textContent = "✓ " + state.handle.name + " · 自动保存已连接";
  } else {
    el.className = "warn";
    el.textContent = "未绑定 — 数据只存浏览器本地";
  }
}

$("btnBind").addEventListener("click", async () => {
  if (!window.showSaveFilePicker) {
    toast("当前浏览器不支持文件绑定，请用 Edge/Chrome", true);
    return;
  }
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: "bgm_library.jsonl",
      types: [{ description: "JSONL", accept: { "application/json": [".jsonl"] } }],
    });
    const switched = state.handle && state.handle !== handle;
    state.handle = handle;
    try {
      const file = await handle.getFile();
      if (file.size > 0) {
        importJSONLText(await file.text(), true);
        toast("已绑定并读入现有数据", false, "thanks.png");
      } else {
        toast("已绑定新数据库文件", false, "love.png");
      }
    } catch (e) { /* 读失败当新文件 */ }
    await idbPut("dbHandle", handle); // 关键：持久化 handle，下次自动恢复
    log("ok", "绑定", "数据库文件已绑定：" + handle.name);

  } catch (e) {
    if (e.name !== "AbortError") { toast("绑定失败：" + e.message, true); log("err", "绑定", e.message); }
  }
});

async function tryRestoreHandle() {
  try {
    const handle = await idbGet("dbHandle");
    if (!handle) return;
    const perm = await handle.queryPermission({ mode: "readwrite" });
    if (perm === "granted") {
      state.handle = handle;
      const file = await handle.getFile();
      if (file.size > 0) importJSONLText(await file.text(), true);
      state.lastKnownMtime = file.lastModified;
      log("ok", "自动恢复", "数据库连接已自动恢复：" + handle.name);
      updateDbStatus(); renderAll();
    } else {
      // prompt 状态：需要用户手势，显示横幅
      state._pendingHandle = handle;
      $("restoreBanner").classList.add("show");
      log("info", "自动恢复", "等待用户点击授权");
    }
  } catch (e) {
    log("warn", "自动恢复", "失败：" + e.message);
  }
}

$("btnRestore").addEventListener("click", async () => {
  const handle = state._pendingHandle;
  if (!handle) { $("restoreBanner").classList.remove("show"); return; }
  try {
    const perm = await handle.requestPermission({ mode: "readwrite" });
    if (perm === "granted") {
      state.handle = handle;
      const file = await handle.getFile();
      if (file.size > 0) importJSONLText(await file.text(), true);
      state.lastKnownMtime = file.lastModified;
      $("restoreBanner").classList.remove("show");
      log("ok", "手动恢复", "数据库连接已恢复");
      toast("数据库连接已恢复", false, "thanks.png");
      updateDbStatus(); renderAll();

      toast("未授权，数据库未连接", true);
    }

});

// 外部变更轮询：JSONL 被外部改动 → 自动重载反映到界面
setInterval(async () => {
  if (!state.handle) return;
  try {
    const file = await state.handle.getFile();
    if (file.lastModified !== state.lastKnownMtime) {
      state.lastKnownMtime = file.lastModified;
      const n = importJSONLText(await file.text(), true, true);
      toast(`检测到数据库文件外部更新，已同步 ${n} 条`, false, "salute.png");
      renderAll();
    }
  } catch (e) { /* 文件被移动等场景，静默 */ }
}, 5000);

/* ══════════════ 文件载入 ══════════════ */

async function sniffFormat(file) {
  const head = new Uint8Array(await file.slice(0, 12).arrayBuffer());
  const ascii = String.fromCharCode(...head);
  if (ascii.startsWith("ftyp")) return "m4a";
  if (head[0] === 0x49 && head[1] === 0x44 && head[2] === 0x33) return "mp3";
  if (head[0] === 0xFF && (head[1] & 0xE0) === 0xE0) return "mp3";
  if (ascii.startsWith("RIFF")) return "wav";
  if (ascii.startsWith("OggS")) return "ogg";
  if (ascii.startsWith("fLaC")) return "flac";
  return null;
}

async function addDirectory(fileList, kind) {
  const audioExts = /\.(mp3|m4a|wav|ogg|flac|aac)$/i;
  let added = 0, dup = 0;
  for (const f of fileList) {
    if (f.name.startsWith(".")) continue;
    if (!audioExts.test(f.name)) continue;
    const base = f.name.replace(/\.[^.]+$/, "");
    if (state.tracks[base]) {
      // 同名已存在：如果旧的是占位（无文件无url），补上实体
      const t = state.tracks[base];
      if (!t._file && !t.url) { t._file = f; t.url = null; }
      dup++;
      continue;
    }
    let fmt = audioExts.exec(f.name)[1].toLowerCase();
    try { const s = await sniffFormat(f); if (s) fmt = s; } catch (e) {}
    state.tracks[base] = { id: base, file: f.name, kind, fmt, size: f.size, _file: f, url: null };
    added++;
  }
  rebuildOrder(); saveLocal();
  renderAll();
  log("info", "添加目录", `kind=${kind} 新增 ${added} 首，重复跳过 ${dup} 首`);
  toast(`新增 ${added} 首${dup ? `（重复 ${dup} 跳过）` : ""}`, false, kind === "sfx" ? "hmm.png" : "happy.png");
  if (added && !state.current) playFirstVisible();
}

function rebuildOrder() { state.order = Object.keys(state.tracks).sort(); }

function pickDirectory(kind) {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.webkitdirectory = true;
  inp.onchange = async () => {
    if (!inp.files.length) return;
    await addDirectory([...inp.files], kind);
  };
  inp.click();
}
$("btnAddMusic").addEventListener("click", () => pickDirectory("music"));
$("btnAddSfx").addEventListener("click", () => pickDirectory("sfx"));

/* 一键同步剪映缓存：增量导入，已导入的自动跳过 */
$("btnSyncJy").addEventListener("click", () => {
  if (state._serverMode) {
    syncFromServer(); // 服务器模式：直接重新拉清单，无需选目录
    return;
  }

    "在弹出的窗口里选中剪映缓存文件夹即可：\n\n" +
    "C:\\Users\\Administrator\\AppData\\Local\\\nJianyingPro\\User Data\\Cache\\music\n\n" +
    "（提示：把上面的路径粘贴到选择器顶部地址栏最快）\n" +
    "已导入过的文件会自动跳过，只有新缓存会被加进来。"
  );
  if (ok) pickDirectory("music");
});

/* ══════════════ 播放 ══════════════ */

async function playTrack(id) {
  const t = state.tracks[id];
  if (!t) return;
  state.current = id;
  if (!t.url && t._file) t.url = URL.createObjectURL(t._file);
  if (!t.url) {
    toast("这首来自上次会话，重新「添加目录」后才能播放", true, "sleepy.png");
  }
  audio.src = t.url || "";
  audio.play().catch(() => {});
  renderNowName(); renderList(); renderTagPanel(); drawWave(t);
  saveLocal();
}

function renderNowName() {
  const t = state.tracks[state.current];
  const el = $("nowName");
  el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; // 重触发弹入
  if (!t) { el.innerHTML = `还没有选中音频，先从左边挑一首吧 <span class="fmt"></span>`; return; }
  const fake = t.file.toLowerCase().endsWith(".mp3") && t.fmt === "m4a";
  el.innerHTML = `${t.file}` +
    `<span class="fmt">${t.kind === "sfx" ? "🔊音效" : "🎵音乐"} · ${t.fmt.toUpperCase()}${fake ? "（扩展名伪装已纠正）" : ""}${t.duration ? " · " + fmtTime(t.duration) : ""}</span>`;
  // 角落贴纸随类型换心情
  $("cornerSticker").src = t.kind === "sfx" ? "assets/stickers/hmm.png" : "assets/stickers/wave.png";
}

audio.addEventListener("loadedmetadata", () => {
  const t = state.tracks[state.current];
  if (t && audio.duration && isFinite(audio.duration)) {
    t.duration = audio.duration;
    if (state.records[state.current]) state.records[state.current].duration = audio.duration;
    updateTimeLabels(); renderNowName(); renderList();
    scheduleSave("时长解析");
  }
});

audio.addEventListener("ended", () => {
  if ($("loopBox").checked) { audio.currentTime = 0; audio.play(); return; }
  nextTrack(true);
});

function updateTimeLabels() {
  $("timeLabel").textContent = `${fmtTime(audio.currentTime)} / ${fmtTime(audio.duration)}`;
  if (audio.duration && !seeking) { // 拖动进度条时不回写，避免和手打架
    $("seekBar").value = Math.round(audio.currentTime / audio.duration * 1000);
    $("waveProgress").style.width = (audio.currentTime / audio.duration * 100) + "%";
  }
}
audio.addEventListener("timeupdate", updateTimeLabels);

let seeking = false;
$("seekBar").addEventListener("pointerdown", () => { seeking = true; });
$("seekBar").addEventListener("input", () => {
  if (audio.duration) audio.currentTime = $("seekBar").value / 1000 * audio.duration;
});
$("seekBar").addEventListener("change", () => { // 松手才算拖完
  if (audio.duration) {
    audio.currentTime = $("seekBar").value / 1000 * audio.duration;
    $("waveProgress").style.width = (audio.currentTime / audio.duration * 100) + "%";
  }
  seeking = false;
});
$("btnPlay").addEventListener("click", () => {
  if (audio.paused) { if (!audio.src && state.current) playTrack(state.current); else audio.play(); }
  else audio.pause();
});
audio.addEventListener("play", () => $("btnPlay").textContent = "⏸");
audio.addEventListener("pause", () => $("btnPlay").textContent = "▶");
$("vol").addEventListener("input", () => audio.volume = $("vol").value / 100);
audio.volume = 0.9;
$("rateSel").addEventListener("change", () => audio.playbackRate = parseFloat($("rateSel").value));
$("waveCanvas").addEventListener("click", e => {
  if (!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  audio.currentTime = (e.clientX - rect.left) / rect.width * audio.duration;
});

/* ══════════════ 波形 ══════════════ */

const waveCache = {};
async function trackArrayBuffer(t) {
  if (t._file) return t._file.arrayBuffer();
  if (t.url) return (await fetch(t.url)).arrayBuffer();
  return null;
}

async function drawWave(t) {
  const canvas = $("waveCanvas");
  const ctx = canvas.getContext("2d");
  const W = canvas.width = canvas.offsetWidth * devicePixelRatio;
  const H = canvas.height = canvas.offsetHeight * devicePixelRatio;
  const drawPeaks = peaks => {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#e8613c";
    const n = peaks.length, bw = W / n;
    for (let i = 0; i < n; i++) {
      const h = Math.max(2, peaks[i] * H * 0.92);
      ctx.fillRect(i * bw, (H - h) / 2, Math.max(1, bw * 0.7), h);
    }
  };
  const drawPlaceholder = txt => {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#b3a184";
    ctx.font = `${13 * devicePixelRatio}px sans-serif`;
    ctx.textAlign = "center";
    ctx.fillText(txt, W / 2, H / 2 + 5 * devicePixelRatio);
  };
  if (waveCache[t.id]) { drawPeaks(waveCache[t.id]); return; }
  if (!t._file && !t.url) { drawPlaceholder("重新添加目录后显示波形"); return; }
  drawPlaceholder("解码波形中…");
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!drawWave._ac) drawWave._ac = new AC();
    const bufData = await trackArrayBuffer(t);
    if (bufData === null) { drawPlaceholder("重新添加目录后显示波形"); return; }
    const buf = await drawWave._ac.decodeAudioData(bufData);
    const ch = buf.getChannelData(0);
    const N = 600, block = Math.floor(ch.length / N);
    const peaks = new Array(N);
    for (let i = 0; i < N; i++) {
      let max = 0;
      const start = i * block;
      for (let j = 0; j < block; j += 16) { const v = Math.abs(ch[start + j]); if (v > max) max = v; }
      peaks[i] = max;
    }
    waveCache[t.id] = peaks;
    if (state.current === t.id) drawPeaks(peaks);
  } catch (e) {
    if (state.current === t.id) drawPlaceholder("波形解码失败（不影响播放）");
    log("warn", "波形", `${t.file} 解码失败：${e.message}`);
  }
}

/* ══════════════ 列表与筛选 ══════════════ */

function isLabeled(id) {
  const r = state.records[id];
  if (!r) return false;
  return Object.values(r.tags || {}).some(arr => arr.length > 0) || !!(r.note && r.note.trim());
}

function visibleIds() {
  let ids = state.order;
  const q = state.search.trim().toLowerCase();
  if (q) ids = ids.filter(id => {
    const r = state.records[id];
    const inName = id.toLowerCase().includes(q);
    const inNote = r && r.note && r.note.toLowerCase().includes(q); // 备注搜索：辅助选曲
    return inName || inNote;
  });
  if (state.filter === "labeled") ids = ids.filter(isLabeled);
  else if (state.filter === "unlabeled") ids = ids.filter(id => !isLabeled(id));
  if (state.kindFilter !== "all") ids = ids.filter(id => (state.tracks[id].kind || "music") === state.kindFilter);
  if (state.tagFilter) {
    const { group, tag } = state.tagFilter;
    ids = ids.filter(id => {
      const r = state.records[id];
      return r && r.tags && r.tags[group] && r.tags[group].includes(tag);
    });
  }
  return ids;
}

function renderList() {
  const wrap = $("trackList");
  const ids = visibleIds();
  if (!ids.length) {
    const hasAny = Object.keys(state.tracks).length > 0;
    wrap.innerHTML = `<div id="emptyHint"><img src="assets/stickers/${hasAny ? "sad.png" : "sleepy.png"}" alt="">` +
      (hasAny ? "这个筛选条件下没有音频<br>松松条件试试？" : "还没有音频呢<br>点上面「🎵 添加音乐目录」或「🔊 添加音效目录」<br>把剪映缓存文件夹加进来吧") + `</div>`;
    return;
  }
  const frag = document.createDocumentFragment();
  for (const id of ids) {
    const t = state.tracks[id];
    const div = document.createElement("div");
    div.className = "track" + (id === state.current ? " current" : "");
    const r = state.records[id];
    const preview = r ? Object.values(r.tags).flat().slice(0, 4).join("·") : "";
    div.innerHTML = `<span class="status">${isLabeled(id) ? "✅" : "⬜"}</span>` +
      `<span class="kindBadge ${t.kind || "music"}">${t.kind === "sfx" ? "音效" : "音乐"}</span>` +
      `<span class="name">${t.file}</span>` +
      (preview ? `<span class="preview-tags">${preview}</span>` : "") +
      `<span class="dur">${t.duration ? fmtTime(t.duration) : ""}</span>`;
    div.onclick = () => playTrack(id);
    frag.appendChild(div);
  }
  wrap.replaceChildren(frag);
}

function renderProgress() {
  const total = state.order.length;
  let done = 0;
  for (const id of state.order) if (isLabeled(id)) done++;
  $("progDone").textContent = done;
  $("progTotal").textContent = total;
  $("cntAll").textContent = total ? "" : "";
  $("cntDone").textContent = total ? ` ${done}` : "";
  $("cntTodo").textContent = total ? ` ${total - done}` : "";
}

function playFirstVisible() {
  const ids = visibleIds();
  if (ids.length) playTrack(ids[0]);
}
function nextTrack(auto) {
  const ids = visibleIds();
  if (!ids.length) return;
  const idx = ids.indexOf(state.current);
  const nxt = ids[idx + 1] ?? (auto ? null : ids[0]);
  if (nxt && nxt !== state.current) playTrack(nxt);
}
function prevTrack() {
  const ids = visibleIds();
  if (!ids.length) return;
  const idx = ids.indexOf(state.current);
  playTrack(ids[idx - 1] ?? ids[ids.length - 1]);
}
$("btnNext").addEventListener("click", () => nextTrack(false));
$("btnPrev").addEventListener("click", prevTrack);

/* ══════════════ 打标面板 ══════════════ */

function ensureRecord(id) {
  if (!state.records[id]) {
    const t = state.tracks[id];
    state.records[id] = {
      id, file: t.file, kind: t.kind || "music",
      duration: t.duration || null,
      tags: {}, labeled_at: nowISO(), updated_at: nowISO(),
    };
  }
  return state.records[id];
}

function renderTagPanel() {
  const wrap = $("groupsWrap");
  const cur = state.current;
  const rec = cur ? state.records[cur] : null;
  wrap.replaceChildren();

  for (const g of state.groups) {
    const card = document.createElement("div");
    card.className = "groupCard";
    const head = document.createElement("div");
    head.className = "groupHead";
    const selectedCount = rec && rec.tags[g.name] ? rec.tags[g.name].length : 0;
    head.innerHTML = `<span class="gdot"></span><span class="gname">${g.name}</span>` +
      `<span class="gcount">${selectedCount ? `已选 ${selectedCount}` : ""}</span><span class="spacer"></span>`;
    const btnAdd = document.createElement("button");
    btnAdd.className = "btn small bouncy"; btnAdd.textContent = "＋ 标签";
    btnAdd.onclick = () => openAddTag(g.name);
    const btnDel = document.createElement("button");
    btnDel.className = "btn small danger bouncy"; btnDel.textContent = "删组";
    btnDel.onclick = () => openDelGroup(g.name);
    head.append(btnAdd, btnDel);

    const row = document.createElement("div");
    row.className = "tagRow";
    for (const tag of g.tags) {
      const sp = document.createElement("span");
      const on = rec && rec.tags[g.name] && rec.tags[g.name].includes(tag);
      sp.className = "tag" + (on ? " on" : "");
      sp.innerHTML = tag + (on ? `<span class="delTag" title="移除">✕</span>` : "");
      sp.onclick = e => {
        if (!cur) { toast("先选一首音频再打标哦", true, "proud.png"); return; }
        if (e.target.classList.contains("delTag")) toggleTag(g.name, tag, true);
        else toggleTag(g.name, tag);
      };
      row.appendChild(sp);
    }
    card.append(head, row);
    wrap.appendChild(card);
  }
  const btnNewGroup = document.createElement("button");
  btnNewGroup.className = "btn bouncy";
  btnNewGroup.textContent = "＋ 新增标签组";
  btnNewGroup.onclick = openAddGroup;
  wrap.appendChild(btnNewGroup);

  $("noteBox").value = (rec && rec.note) || "";
  $("noteBox").disabled = !cur;
  // 类型切换按钮
  const t = cur ? state.tracks[cur] : null;
  $("btnKind").textContent = t && t.kind === "sfx" ? "🔊 这是音效" : "🎵 这是音乐";
}

function toggleTag(group, tag, onlyOff) {
  const id = state.current;
  if (!id) return;
  const r = ensureRecord(id);
  if (!r.tags[group]) r.tags[group] = [];
  const i = r.tags[group].indexOf(tag);
  if (i >= 0) r.tags[group].splice(i, 1);
  else if (!onlyOff) r.tags[group].push(tag);
  r.updated_at = nowISO();
  renderTagPanel(); renderList(); renderProgress(); renderTagFilters();
  scheduleSave("打标");
}

// 切换当前曲类型
$("btnKind").addEventListener("click", () => {
  const id = state.current;
  if (!id) return;
  const t = state.tracks[id];
  t.kind = t.kind === "sfx" ? "music" : "sfx";
  if (state.records[id]) {
    state.records[id].kind = t.kind;
    state.records[id].updated_at = nowISO();
    scheduleSave("改类型");
  } else {
    saveLocal();
  }
  log("info", "改类型", `${t.file} → ${t.kind}`);
  renderTagPanel(); renderList(); renderNowName();
  toast(t.kind === "sfx" ? "改成音效了 🔊" : "改成音乐了 🎵", false, "hmm.png");
});

let noteSaveTimer = null;
function commitNote() {
  const id = state.current;
  if (!id) return;
  const r = ensureRecord(id);
  r.note = $("noteBox").value.trim() || undefined;
  r.updated_at = nowISO();
  renderList(); renderProgress();
  scheduleSave("写备注");
}
$("noteBox").addEventListener("input", () => {
  clearTimeout(noteSaveTimer);
  noteSaveTimer = setTimeout(commitNote, 600); // 打字停顿即存，不等失焦

$("noteBox").addEventListener("change", () => {

$("btnClear").addEventListener("click", () => {
  const id = state.current;
  if (!id) return;
  delete state.records[id];
  renderTagPanel(); renderList(); renderProgress();
  scheduleSave("清空标签");
  log("info", "清空", state.tracks[id].file);

/* ══════════════ ✨ 备注打标（规则版，增量不覆盖） ══════════════ */

$("btnAiTag").addEventListener("click", () => {
  const targets = Object.values(state.records).filter(r => r.note && r.note.trim());
  if (!targets.length) {
    log("warn", "备注打标", "没有带备注的音频，未执行");
    toast("还没有带备注的音频，先给几首写写备注吧", true, "sleepy.png");
    return;
  }
  let taggedCount = 0, addedTotal = 0;
  const details = [];
  for (const r of targets) {
    const note = r.note.toLowerCase();
    let added = 0;
    for (const g of state.groups) {
      for (const tag of g.tags) {
        if (r.tags[g.name] && r.tags[g.name].includes(tag)) continue; // 增量：已有的跳过
        const words = [tag, ...(NOTE_SYNONYMS[tag] || [])];
        if (words.some(w => note.includes(w.toLowerCase()))) {
          if (!r.tags[g.name]) r.tags[g.name] = [];
          r.tags[g.name].push(tag);
          r.updated_at = nowISO();
          added++;
        }
      }
    }
    if (added) { taggedCount++; addedTotal += added; details.push(`${r.file.slice(0, 12)}… +${added}`); }
  }
  log(addedTotal ? "ok" : "info", "备注打标", `扫描 ${targets.length} 条备注，为 ${taggedCount} 首增量补了 ${addedTotal} 个标签`);
  if (addedTotal) {
    saveDB("备注打标");
    renderAll();
    toast(`根据备注为 ${taggedCount} 首补了 ${addedTotal} 个标签（未动已有标签）`, false, "cheer.png");
  } else {
    toast("扫了一遍备注，没有能补的新标签", false, "hmm.png");
  }
});

/* ══════════════ 📦 整理导出（统一重命名） ══════════════ */

function stdNameFor(r, t) {
  const parts = [];
  for (const g of state.groups) {
    const tags = (r.tags && r.tags[g.name] || []).filter(Boolean);
    if (tags.length) parts.push(tags.join("·"));
  }
  const hash8 = r.id.slice(0, 8);
  const ext = (t && t.file.match(/\.[^.]+$/)?.[0]) || ".mp3";
  if (parts.length) return parts.join("-") + "_" + hash8 + ext;
  if (r.note) {
    const snippet = r.note.slice(0, 12).replace(/[\\/:*?"<>|]/g, "");
    return `备注-${snippet}_${hash8}${ext}`;
  }
  return r.id + ext;
}

$("btnOrganize").addEventListener("click", async () => {
  if (!window.showDirectoryPicker) { toast("此浏览器不支持选择导出文件夹，请用 Edge/Chrome", true); return; }
  const labeled = Object.values(state.records).filter(r => isLabeled(r.id) && state.tracks[r.id]);
  if (!labeled.length) { toast("还没有已打标的音频，先打几首再整理", true, "sleepy.png"); return; }
  const withFile = labeled.filter(r => state.tracks[r.id]._file || state.tracks[r.id].url);
  const musicN = withFile.filter(r => (r.kind || "music") === "music").length;
  const sfxN = withFile.length - musicN;
  $("orgPreview").innerHTML =
    `将把 <b>${withFile.length}</b> 首已打标音频按标准名复制到你选的文件夹：<br>` +
    `🎵 音乐 <b>${musicN}</b> 首 → <code>音乐/</code> 子文件夹<br>🔊 音效 <b>${sfxN}</b> 首 → <code>音效/</code> 子文件夹<br>` +
    `命名格式：<code>情绪标签-场景标签-剧情标签_哈希前8位.扩展名</code><br>` +
    `<span style="color:var(--ink-faint);font-size:12px">只复制不改原文件；同名已存在会跳过。${labeled.length - withFile.length} 首需要重新添加目录后才能导出。</span>`;
  const dlg = $("dlgOrganize");
  dlg.showModal();
  $("orgOk").onclick = async () => {
    dlg.close();
    let outDir;
    try { outDir = await window.showDirectoryPicker({ mode: "readwrite" }); }
    catch (e) { return; }
    let ok = 0, skip = 0, fail = 0;
    const dirMusic = await outDir.getDirectoryHandle("音乐", { create: true });
    const dirSfx = await outDir.getDirectoryHandle("音效", { create: true });
    toast("整理中…", false, "cheer.png");
    for (const r of withFile) {
      const t = state.tracks[r.id];
      const dir = (r.kind || "music") === "sfx" ? dirSfx : dirMusic;
      const name = stdNameFor(r, t);
      try {
        const fh = await dir.getFileHandle(name, { create: true });
        const existing = await fh.getFile();
        if (existing.size > 0) { skip++; continue; }
        const w = await fh.createWritable();
        const data = await trackArrayBuffer(t);
        await w.write(data);
        await w.close();
        ok++;
      } catch (e) { fail++; log("err", "整理导出", `${name} 失败：${e.message}`); }
    }
    log("ok", "整理导出", `成功 ${ok}，跳过（已存在）${skip}，失败 ${fail} → ${outDir.name}`);
    toast(`整理完成！复制 ${ok} 首，跳过 ${skip} 首${fail ? `，失败 ${fail} 首（见日志）` : ""}`, fail > 0, "thanks.png");
  };
});
$("orgCancel").addEventListener("click", () => $("dlgOrganize").close());

let dlgCtx = null;
function openAddTag(groupName) {
  dlgCtx = groupName;
  $("dlgTagTitle").textContent = `在「${groupName}」组新增标签`;
  $("dlgTagInput").value = "";
  $("dlgAddTag").showModal();
  $("dlgTagInput").focus();
}
$("dlgTagOk").addEventListener("click", () => {
  const g = state.groups.find(x => x.name === dlgCtx);
  const raw = $("dlgTagInput").value.trim();
  if (!g || !raw) { $("dlgAddTag").close(); return; }
  let added = 0;
  for (const t of raw.split(/[,，、\s]+/).filter(Boolean)) {
    if (!g.tags.includes(t)) { g.tags.push(t); added++; }
  }
  $("dlgAddTag").close();
  renderTagPanel(); renderTagFilters(); scheduleSave("加标签");
  log("info", "加标签", `${dlgCtx} 组 +${added}`);
  if (added) toast(`已添加 ${added} 个标签`, false, "cheer.png");
});
$("dlgTagCancel").addEventListener("click", () => $("dlgAddTag").close());
$("dlgTagInput").addEventListener("keydown", e => { if (e.key === "Enter") $("dlgTagOk").click(); });

function openAddGroup() {
  $("dlgGroupInput").value = "";
  $("dlgAddGroup").showModal();
  $("dlgGroupInput").focus();
}
$("dlgGroupOk").addEventListener("click", () => {
  const name = $("dlgGroupInput").value.trim();
  if (!name) { $("dlgAddGroup").close(); return; }
  if (state.groups.some(g => g.name === name)) { toast("组名已存在啦", true); return; }
  state.groups.push({ name, tags: [] });
  $("dlgAddGroup").close();
  renderTagPanel(); renderTagFilters(); scheduleSave("加组");
  log("info", "加组", name);
  toast(`已新增「${name}」组，点「＋ 标签」往里加`, false, "proud.png");
});
$("dlgGroupCancel").addEventListener("click", () => $("dlgAddGroup").close());
$("dlgGroupInput").addEventListener("keydown", e => { if (e.key === "Enter") $("dlgGroupOk").click(); });

let delGroupName = null;
function openDelGroup(name) {
  delGroupName = name;
  $("dlgDelText").textContent = `确认删除「${name}」组？该组所有标签及已打数据将一并移除，删了可就回不来啦。`;

$("dlgDelCancel").addEventListener("click", () => $("dlgDelGroup").close());

document.querySelectorAll('[data-k]').forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll('[data-k]').forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.kindFilter = btn.dataset.k;
    renderList();
  });
});

function renderTagFilters() {
  const row = $("tagFilterRow");
  row.replaceChildren();
  const used = {};
  for (const id in state.records) {
    const r = state.records[id];
    for (const g in (r.tags || {})) {
      for (const t of r.tags[g]) {
        const key = g + "·" + t;
        used[key] = (used[key] || 0) + 1;
      }
    }
  }
  const keys = Object.keys(used).sort((a, b) => used[b] - used[a]).slice(0, 24);
  for (const k of keys) {
    const [g, t] = k.split("·");
    const sp = document.createElement("span");
    sp.className = "tf-tag" + (state.tagFilter && state.tagFilter.group === g && state.tagFilter.tag === t ? " on" : "");
    sp.textContent = t;
    sp.title = `${g} · ${used[k]} 首`;
    sp.onclick = () => {
      if (state.tagFilter && state.tagFilter.group === g && state.tagFilter.tag === t) state.tagFilter = null;
      else state.tagFilter = { group: g, tag: t };
      renderTagFilters(); renderList();
    };
    row.appendChild(sp);
  }
}

/* ══════════════ 导入 / 导出 ══════════════ */

$("btnImport").addEventListener("click", () => {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".jsonl";
  inp.onchange = async () => {
    if (!inp.files[0]) return;
    importJSONLText(await inp.files[0].text(), false);
    renderAll(); scheduleSave("导入");
  };
  inp.click();
});
$("btnExport").addEventListener("click", () => {
  const blob = new Blob([buildJSONLText()], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bgm_library_" + new Date().toISOString().slice(0, 10) + ".jsonl";
  a.click();
  URL.revokeObjectURL(a.href);
  log("info", "导出", "手动导出 JSONL 备份");
});

/* ══════════════ 换头像 ══════════════ */

const logoSaved = localStorage.getItem(LS_KEY_LOGO) || "happy";
$("logoImg").src = "assets/stickers/" + logoSaved + ".png";
$("logoBtn").addEventListener("click", () => {
  const grid = $("stickerGrid");
  grid.replaceChildren();
  for (const s of STICKERS) {
    const cell = document.createElement("div");
    cell.className = "stickerCell" + (s === logoSaved ? " on" : "");
    cell.innerHTML = `<img src="assets/stickers/${s}.png" alt="${s}">`;
    cell.onclick = () => {
      localStorage.setItem(LS_KEY_LOGO, s);
      $("logoImg").src = "assets/stickers/" + s + ".png";
      $("dlgLogo").close();
      log("info", "换头像", s);
      toast("换了新头像～", false, s + ".png");
    };
    grid.appendChild(cell);
  }
  $("dlgLogo").showModal();
});
$("dlgLogoClose").addEventListener("click", () => $("dlgLogo").close());

/* ══════════════ 快捷键 ══════════════ */

document.addEventListener("keydown", e => {
  const tag = document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  if (e.code === "Space") { e.preventDefault(); $("btnPlay").click(); }
  else if (e.key === "ArrowRight") nextTrack(false);
  else if (e.key === "ArrowLeft") prevTrack();
});

/* ══════════════ 服务器模式 ══════════════ */

async function loadFromServer(serverBase) {
  state._serverMode = serverBase.replace(/\/$/, "");
  await syncFromServer(true);
}

// 从服务器清单增量同步：只有新文件会入库，已打标签的记录永不动
async function syncFromServer(first) {
  const base = state._serverMode;
  if (!base) return;
  try {
    const r = await fetch(base + "/manifest.json", { cache: "no-store" });
    const data = await r.json();
    let added = 0;
    for (const f of data.files || []) {
      const base2 = f.name.replace(/\.[^.]+$/, "");
      const url = f.url || base + "/music/" + encodeURIComponent(f.name);
      if (state.tracks[base2]) {
        const t = state.tracks[base2];
        if (!t._file && !t.url) { t.url = url; if (f.fmt) t.fmt = f.fmt; }
        continue;
      }
      state.tracks[base2] = {
        id: base2, file: f.name, kind: f.kind || "music",
        fmt: f.fmt || "", size: f.size || 0, _file: null, url,
      };
      added++;
    }
    rebuildOrder(); saveLocal(); renderList(); renderProgress();
    if (first) {
      log("info", "服务器模式", `载入 ${added} 首`);
      toast(`服务器模式：载入 ${added} 首`, false, "wave.png");
      if (state.order.length && !state.current) playFirstVisible();
    } else if (added) {
      log("ok", "自动同步", `剪映缓存新增 ${added} 首，已入库`);
      toast(`剪映缓存有新增，自动加了 ${added} 首 🎉`, false, "cheer.png");
    }
    return added;
  } catch (e) {
    if (first) { toast("服务器清单载入失败：" + e.message, true); log("err", "服务器模式", e.message); }
  }
}

/* ══════════════ 版本更新检测 ══════════════ */

function verCmp(a, b) { // 返回 1 表示 a 更新
  const pa = a.split(".").map(Number), pb = b.split(".").map(Number);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const d = (pa[i] || 0) - (pb[i] || 0);
    if (d) return d > 0 ? 1 : -1;
  }
  return 0;
}

async function checkUpdate() {
  try {
    const r = await fetch(RELEASE_VERSION_URL, { cache: "no-store" });
    const v = await r.json();
    if (!v.version || verCmp(v.version, APP_VERSION) <= 0) return;
    if (localStorage.getItem(LS_KEY_SKIPVER) === v.version) return;
    state._remote = v;
    $("updateText").innerHTML = `🆕 发现新版本 <b>v${v.version}</b>（当前 v${APP_VERSION}）` +
      (v.notes && v.notes.length ? `：${v.notes.slice(0, 2).join("；")}` : "");
    $("updateBanner").style.display = "flex";
    log("info", "更新检测", `远端 v${v.version} > 本地 v${APP_VERSION}`);
  } catch (e) {
    log("info", "更新检测", "远端版本获取失败（网络问题？跳过）");
  }
}

$("btnUpdateIgnore").addEventListener("click", () => {
  if (state._remote) localStorage.setItem(LS_KEY_SKIPVER, state._remote.version);
  $("updateBanner").style.display = "none";
  toast("好叭，这个版本先不更了", false, "hmm.png");
});

$("btnUpdateNow").addEventListener("click", async () => {
  const btn = $("btnUpdateNow");
  if (!state._serverMode) {
    // 纯浏览器模式没有本地服务，无法自替换，引导去发布页
    toast("浏览器直开模式不支持自动更新，已打开发布页", false, "sad.png");
    window.open("https://lyzbcy.github.io/laoyu-tagger/?dl=1", "_blank");
    return;
  }
  btn.disabled = true;
  btn.textContent = "更新中…";
  toast("正在下载并替换新版本…", false, "cheer.png");
  try {
    const r = await fetch("/self-update", { cache: "no-store" });
    const res = await r.json();
    if (res.ok) {
      toast(`已更新到 v${res.version}，页面即将刷新`, false, "thanks.png");
      localStorage.removeItem(LS_KEY_SKIPVER);
      log("ok", "一键更新", `成功更新到 v${res.version}`);
      setTimeout(() => location.reload(), 1400);
    } else {
      throw new Error(res.error || "未知失败");
    }
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "一键更新";
    toast("自动更新失败：" + e.message + "，请去发布页手动下载", true);
    log("err", "一键更新", e.message);
  }
});

/* ══════════════ 启动 ══════════════ */

function renderAll() {
  renderList(); renderProgress(); renderTagPanel(); renderTagFilters(); renderNowName();
}

const restored = loadLocal();
if (restored) {
  for (const id in state.tracks) {
    const t = state.tracks[id];
    t._file = null; // File 对象不可序列化，重启后需重新添加目录
  }
}
renderAll();
updateDbStatus();
setInterval(saveLocal, 5000);
tryRestoreHandle(); // 尝试自动恢复数据库连接

const serverParam = new URLSearchParams(location.search).get("server");
if (serverParam) {
  loadFromServer(serverParam);
  // 自适应更新：每 60 秒悄悄对一次清单，剪映缓存有新增就自动入库
  setInterval(() => syncFromServer(false), 60000);
}

// 打开即检查远端版本（静默，失败不打扰）
setTimeout(checkUpdate, 2000);

if (restored && state.order.length) {
  toast(`恢复了上次会话：${state.order.length} 首（重新「添加目录」后才能播放）`, false, "happy.png");
}
log("info", "启动", `捞鱼打标工具启动 · 恢复 ${restored ? state.order.length + " 首" : "空库"}`);
</script>
